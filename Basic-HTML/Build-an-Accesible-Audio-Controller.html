<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Audio Controller</title>
</head>
<body>
  <h1>Accessible Audio Controller</h1>
  <audio controls>
    <source src="audio-file.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  <label for="volume">Volume:</label>
  <input type="range" id="volume" name="volume" min="0" max="100" value="50" aria-label="Volume control">
  <label for="playbackRate">Playback Speed:</label>
  <input type="range" id="playbackRate
</html>
