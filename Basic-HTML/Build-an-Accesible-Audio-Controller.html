<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Audio Controller</title>
</head>
<body>
  <h1>Accessible Audio Controller</h1>
  <button type="button" id="playButton">Play</button>
  <audio controls>
    <div>
        <span id="volume-label" aria-live="polite">Volume: 50%</span>
    </div>

    </audio>

</body>
</html>
