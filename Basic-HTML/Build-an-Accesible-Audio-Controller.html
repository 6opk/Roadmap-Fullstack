<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Audio Controller</title>
</head>
<body>
  <h1>Accessible Audio Controller</h1>
  <button type="button" id="playButton">Play</button>
  <audio controls>
    <div>
        <span id="volume-label" aria-live="polite">Volume: 50%</span>
        <span id="volume-description" aria-live="polite">Adjust the sound level
        </span>
        <input type="range" id="volume" min="0" max="100" value="50" aria-labelledby="volume-label volume-description">
    </div>
<button type="button" id="muteButton">Mute</button>     
    </audio>

</body>
</html>
