<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
</head>
<body>
    <h1>Multimedia Player</h1>
    <section>
        <h2>Audio Player</h2>
        <audio controls aria-label="Audio Player">
            <source src="audio-file.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>  
    <section>
        <h2>Video Player</h2>
        <video controls width="320" height="240" aria-label="Video Player">
            <source src="video-file.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>
    <section>
        <h2>Image Gallery</h2>
        <img src="image1.jpg" alt="Image 1" width="200" aria-label="Image 1">
        <img src="image2.jpg" alt="Image 2" width="200" aria-label="Image 2">
        <img src="image3.jpg" alt="Image 3" width="200" aria-label="Image 3 ">
    </section>
</body>
</html>
