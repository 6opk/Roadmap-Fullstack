<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
</head>
<body>
    <h1>Multimedia Player</h1>
    <section>
        <h2>Audio Player</h2>
        <audio controls aria-label="Audio Player">
            <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>  
    <section>
        <h2>Video Player</h2>
        <video controls width="320" height="240" aria-label="Video Player">
            <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
            <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="English">
            Your browser does not support the video tag.
        </video>
    </section>
    <section>
        <h2>Image Gallery</h2>
        <p>Below is an image gallery showcasing various images:</p>
    </section>
</body>
</html>
