<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <a img="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A curriculum labs cube" />
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <imput id="card-name" name="card-name" type="text"
            label="card-name" 
            span aria-hidden="true" required>*</imput>
            <imput id="card-number"
            aria-describedby="card-number-help" 
            name="card-number" type="text"
            label="card-number"
            span aria-hidden="true" required>*</imput>
            <p id="card-number-help">you have to required the card number format</p>
        </form>
    </section>
</body>
</html>
