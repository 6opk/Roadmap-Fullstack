<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <title>Checkout Page</title>
</head>
<main>
<body>
    
    <h1>Checkout</h1>
    
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Rubik's cube product">
    </section>
    
    <section>
        <h2>Payment Information</h2>
        <form>
            <div>
            <label for="card-name">
                Name on Card<span aria-hidden="true>*</span>
                </label>
                <input type="text" id="card-name" name="card-name" required>
            </div>
    </section>

    <section>
        <div>
            <label for="card-number">
                Card Number<span aria-hidden="true">*</span>
            </label>
            <input type="text" id="card-number" name="card-number" aria-describedby="card-number-help" required>
            <p id="card-number-help"   
        </div>
    </section>
</body>
</main>
</html>
